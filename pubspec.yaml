name: lobohub
description: Family life in one app — tasks, calendar, meals, budget, and more. (Huddle / LoboHub)
version: 1.0.6+7

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.12.0

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.3

  # Local storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4

  # Biometric auth
  local_auth: ^2.3.0

  # Charts
  fl_chart: ^0.69.0

  # Image handling
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Internationalization
  intl: ^0.20.2

  # UUID generation
  uuid: ^4.5.1

  # HTTP client
  http: ^1.2.2

  # Calendar widget
  table_calendar: ^3.2.0

  # Google Sign-In & Calendar API
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # URL launcher
  url_launcher: ^6.3.2

  # Native share sheet (meal plans, lists)
  share_plus: ^10.1.4

  # Push notifications
  flutter_local_notifications: ^18.0.1

  # SVG support
  flutter_svg: ^2.0.10+1

  # Deep links / app links
  app_links: ^6.3.4

  # Connectivity
  connectivity_plus: ^6.1.1

  # Icons
  cupertino_icons: ^1.0.8

  # JSON serialization
  json_annotation: ^4.9.0

  # Cryptography
  crypto: ^3.0.6
  encrypt: ^5.0.3

  # In-app subscriptions (RevenueCat)
  purchases_flutter: ^8.0.0

  # Firebase push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Gemini AI (direct SDK, used only via edge function proxy)
  # http package already included above

  # Permission handling
  permission_handler: ^11.3.1

  # Apple Health / Health Connect (mobile only; no-op on web)
  health: ^13.3.1

  # File picker (for CSV/PDF import)
  file_picker: ^8.0.0
  firebase_crashlytics: ^4.3.10
  sembast: ^3.8.6
  sembast_web: ^2.4.4+1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  # Required for adaptive icon + ic_launcher_round (API 26+); avoids legacy vector override.
  adaptive_icon_background: "#fafaf9"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    background_color: "#fafaf9"
    theme_color: "#6366f1"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
