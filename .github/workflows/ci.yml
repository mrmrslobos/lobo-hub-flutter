# Gate every PR and main push with static analysis and fast unit tests.
# Live Supabase integration tests run separately (integration-tests.yml).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test test/widget_test.dart test/module_config_test.dart test/notification_service_test.dart test/p0_security_helpers_test.dart test/daily_devotional_service_test.dart test/realtime_apply_test.dart
