# Build Flutter web, package it in a Docker image, and push to GitHub Container
# Registry (ghcr.io).  Watchtower on your Proxmox LXC polls ghcr.io every 5
# minutes and automatically redeploys when a new image is available.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL      — your Supabase project URL
#   SUPABASE_ANON_KEY — your Supabase anon/public key
#
# The GITHUB_TOKEN is provided automatically — no extra secret needed for
# pushing to ghcr.io.

name: Build & push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          # Layer cache — subsequent builds reuse unchanged layers
          cache-from: type=gha
          cache-to: type=gha,mode=max
