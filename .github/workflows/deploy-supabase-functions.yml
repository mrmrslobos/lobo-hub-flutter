# Deploy Supabase Edge Functions (manual).
# Requires repo secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF

name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Function name (or "all" for every function in supabase/functions/)'
        required: false
        default: notify-family
        type: string

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge function(s)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is required."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF secret is required (e.g. vinumlekpmddtbfkojkd)."
            exit 1
          fi
          FN="${{ github.event.inputs.function }}"
          if [ "$FN" = "all" ]; then
            for dir in supabase/functions/*/; do
              name="$(basename "$dir")"
              echo "Deploying $name..."
              supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
            done
          else
            supabase functions deploy "$FN" --project-ref "$SUPABASE_PROJECT_REF"
          fi
