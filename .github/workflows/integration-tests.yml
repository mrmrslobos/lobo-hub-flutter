name: Integration tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/services/database_service.dart'
      - 'lib/services/supabase_service.dart'
      - 'lib/providers/sync_provider.dart'
      - 'test/integration/**'

jobs:
  sync-harness:
    # Fork PRs and workflows on forked copies do not receive upstream secrets reliably.
    if: >-
      github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Sync integration harness (requires repository secrets)
        run: >-
          flutter test test/integration/integration_ci_config_test.dart
          test/integration/sync_two_device_test.dart
          --dart-define=SUPABASE_TEST_URL=${{ secrets.SUPABASE_TEST_URL }}
          --dart-define=SUPABASE_TEST_ANON_KEY=${{ secrets.SUPABASE_TEST_ANON_KEY }}
          --dart-define=HUB_TEST_USER_A_EMAIL=${{ secrets.HUB_TEST_USER_A_EMAIL }}
          --dart-define=HUB_TEST_USER_A_PASSWORD=${{ secrets.HUB_TEST_USER_A_PASSWORD }}
          --dart-define=HUB_TEST_USER_B_EMAIL=${{ secrets.HUB_TEST_USER_B_EMAIL }}
          --dart-define=HUB_TEST_USER_B_PASSWORD=${{ secrets.HUB_TEST_USER_B_PASSWORD }}
          --dart-define=HUB_TEST_FAMILY_ID=${{ secrets.HUB_TEST_FAMILY_ID }}
