server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app uses HashRouter so all routing is handled client-side.
    # This fallback ensures direct URL access still loads the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the runtime env file — it's regenerated at each container start.
    # This must come before the general .js rule below.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache the HTML entry point
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
