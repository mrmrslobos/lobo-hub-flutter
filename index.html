
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>FamilyHub - Family Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Runtime env injection: generated by docker-entrypoint.sh at container start.
         Must load before the app so window.process.env is populated. -->
    <script src="/env-config.js"></script>
    <script>
      // Shim process.env for browser compatibility (fallback if env-config.js absent)
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'production';
      
      // Global error handler
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('Global Error:', msg, error);
        return false;
      };
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcfcf9;
        margin: 0;
      }
      h1, h2, h3, .brand-font {
        font-family: 'Outfit', sans-serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }
      /* Initial loader - dismissed by index.tsx */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fcfcf9;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #6366f122;
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "date-fns": "https://esm.sh/date-fns@^4.1.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.48.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="boot-loader">
      <div class="spinner"></div>
      <div style="font-family: Outfit, sans-serif; color: #6366f1; font-weight: 600; font-size: 14px;">
        Initializing FamilyHub...
      </div>
    </div>
    <div id="root"></div>
    <!-- Safety: dismiss boot-loader after 8 s even if module/CDN loading stalls
         (e.g. first install on slow network). Plain script so it runs before
         any ES module or importmap resolution. -->
    <script>
      setTimeout(function() {
        var bl = document.getElementById('boot-loader');
        if (bl) { bl.style.opacity = '0'; setTimeout(function() { bl.remove(); }, 500); }
      }, 8000);
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
