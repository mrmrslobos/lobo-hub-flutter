plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Only apply Google Services plugin when google-services.json exists
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.opensolutions.huddle'
    // speech_to_text etc.; use a *complete* side-by-side NDK (28.2 was partial: only .installer)
    ndkVersion = "29.0.14206865"
    compileSdkVersion 36

    flavorDimensions 'mode'
    productFlavors {
        standard {
            dimension 'mode'
            // Health Connect (health plugin) + Fitness sync need API 26+.
            minSdkVersion 26
        }
        photoframe {
            dimension 'mode'
            // MUST stay literal 23 — flutter.minSdkVersion is hard-coded to 24 in FlutterExtension.
            minSdkVersion flutter.minSdkVersion
            // Launcher label only; same applicationId as standard.
            resValue 'string', 'app_name', 'Huddle Frame'
        }
    }

    defaultConfig {
        applicationId 'com.opensolutions.huddle'
        // Literal 23 baseline — not flutter.minSdkVersion (24).
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildFeatures {
        resValues true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Removed applicationIdSuffix '.debug' — it caused the package name
            // to become 'com.opensolutions.huddle.debug' which doesn't match the client
            // in google-services.json, breaking Firebase/FCM in debug builds.
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Google Play requires Billing Library 8.0.0+ (purchases_flutter 9+ pulls this transitively).
    implementation 'com.android.billingclient:billing:8.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.window:window:1.2.0'
    implementation 'androidx.window:window-java:1.2.0'
    // MainActivity.enableEdgeToEdge() (predictable insets on Android 15+)
    implementation 'androidx.activity:activity-ktx:1.9.3'
}

// Photoframe targets API 23. Dependency manifests + Flutter defaults can leave intermediates at minSdk 24.
// The APK uses packaged_manifests (after ManifestForPackage). Patch every photoframe manifest XML under intermediates.
def patchPhotoframeManifestMinSdks = { Project proj ->
    File intermediates = proj.file("${proj.buildDir}/intermediates")
    if (!intermediates.isDirectory()) {
        return
    }
    proj.fileTree(dir: intermediates, includes: ['**/photoframe*/**/AndroidManifest.xml']).each { File mf ->
        String text = mf.getText('UTF-8')
        def sdkMatcher = (text =~ /android:minSdkVersion="(\d+)"/)
        if (!sdkMatcher.find()) {
            return
        }
        int cur = sdkMatcher.group(1) as int
        if (cur <= 23) {
            return
        }
        mf.write(text.replaceFirst(/android:minSdkVersion="\d+"/, 'android:minSdkVersion="23"'), 'UTF-8')
        proj.logger.lifecycle("[photoframe] manifest minSdk ${cur} -> 23 (${proj.relativePath(mf)})")
    }
}

afterEvaluate {
    // Immediately before APK packaging (binary manifest is taken from packaged_manifests).
    ['PhotoframeRelease', 'PhotoframeDebug', 'PhotoframeProfile'].each { String suffix ->
        try {
            tasks.named("package${suffix}").configure { t ->
                t.doFirst { patchPhotoframeManifestMinSdks(project) }
            }
        } catch (Exception ignored) {
            // Profile/debug variants may be absent in some setups.
        }
        try {
            tasks.named("process${suffix}ManifestForPackage").configure { t ->
                t.doLast { patchPhotoframeManifestMinSdks(project) }
            }
        } catch (Exception ignored) {
        }
    }

    // Quick check without aapt — run: gradlew :app:photoframePrintPackagedMinSdk
    tasks.register('photoframePrintPackagedMinSdk') {
        dependsOn 'assemblePhotoframeRelease'
        group 'verification'
        description 'Print minSdk from packaged photoframe manifest (no aapt required).'
        doLast {
            File packaged = file("${buildDir}/intermediates/packaged_manifests/photoframeRelease/processPhotoframeReleaseManifestForPackage/AndroidManifest.xml")
            if (!packaged.exists()) {
                throw new GradleException("Missing packaged manifest; build photoframe release first.")
            }
            String line = packaged.readLines().find { it.contains('minSdkVersion') }
            println "photoframe packaged manifest minSdk line: ${line?.trim()}"
        }
    }

    tasks.register('photoframeBadging') {
        dependsOn 'assemblePhotoframeRelease'
        group 'verification'
        description 'Runs aapt dump badging on the photoframe release APK when build-tools are installed.'
        doLast {
            def sdkDirPath = localProperties.getProperty('sdk.dir')
            if (sdkDirPath == null) {
                println 'sdk.dir not set in local.properties — skipping aapt.'
                return
            }
            File sdkDir = file(sdkDirPath)
            File btRoot = new File(sdkDir, 'build-tools')
            List<File> dirs = btRoot.listFiles()?.findAll { it.isDirectory() }?.sort { a, b -> b.name <=> a.name }
            File aapt = dirs?.collect { new File(it, 'aapt.exe') }?.find { it.exists() }
            if (aapt == null || !aapt.exists()) {
                println "No aapt.exe under ${btRoot.path}"
                return
            }
            File repoRoot = rootProject.projectDir.parentFile
            File apk = new File(repoRoot, 'build/app/outputs/flutter-apk/app-photoframe-release.apk')
            if (!apk.exists()) {
                apk = file("${buildDir}/outputs/flutter-apk/app-photoframe-release.apk")
            }
            if (!apk.exists()) {
                println "APK not found at ${apk.absolutePath}"
                return
            }
            exec {
                commandLine aapt.absolutePath, 'dump', 'badging', apk.absolutePath
                standardOutput System.out
                errorOutput System.err
            }
        }
    }
}
